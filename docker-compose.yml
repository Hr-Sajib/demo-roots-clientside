
services:
  frontend:
    container_name: rootsbeyond-demo-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_URL=https://rootsbeyond-api.sajibofficial.me/api/v1
        # Cross-system (Arbora) registration is disabled in this demo build
        # (see src/lib/crossSystemRegister.ts) — intentionally left unset so
        # this build never points at the live production Arbora API.
        - NEXT_PUBLIC_CROSS_SYSTEM_URL=
    restart: unless-stopped
    networks:
      - sajib-net
    # No ports: → internal only (Caddy will proxy)
    deploy:
      resources:
        limits:
          cpus: '1.0'     # prevent CPU spikes
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3003"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  sajib-net:
    external: true
